<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>

    <style>
        /* selector 
        {
            property : value
        } */

        h1{
            background-color: red ;
            color: white;
        }
    </style>
</head>
<body>
    <h1 style="color: red;">
        CSS (Casacading Style Sheet)
    </h1>

    1. Inline Css 

    <h2 style="background-color: green; color: white;">
        Heading First 
    </h2>
    <p style="background-color: green; color: white;"> This is Paragraph </p>



    2. Internal CSS / Embedded Css 
 
    Head 

    <h1>Heading 1 </h1>
    <h1>Heading 2</h1>
    <h1>Heading 3 </h1>

    3. External Css 

    extension .css 
    
    
</body>
</html>
