<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin: 0;}

        .parent{
            width: 100vw;
            height: 100vh;
                display: flex;
                place-items: center;
        }
        .center{
            height: 60%;
        width: 70%; 
        }

        .box{
            color: white;
        height: 200px;
        width: 200px;

        display: inline-block;
        /* display:block; */
        /* display: inline-block; */
        
        /* display: none; */
        }

        #box1{
            background-color: red;
        }
        #box2{
            background-color: purple;
            position: relative;
            z-index: 3;

        }
        #box3{
            background-color: green;
            position: relative;
            top: 100px;
            right: 50px;
            z-index: 1;
        }
        #box4{
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box" id="box1">Box 1</div>
        <div class="box" id="box2">Box 2</div>
        <div class="box" id="box3">Box 3</div>
        <div class="box" id="box4">Box 4</div>
       
    </div>
</body>
</html>
