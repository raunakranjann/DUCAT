<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: gainsboro;
        }
        *{
            margin: 0;
        }
        .menu{
            width: 300px;
            
        }

        h1{
            color: white;
            background-color: green;
            padding: 10px;
            margin-bottom: 2px;
        }
        ul{
            list-style-type: circle;
            list-style-type: none;
            margin-left: -40px;
        }

        li{
            background-color: blue;
            padding: 5px;
            margin-bottom: 1px;
        }
        a{
            color: white;
            text-decoration: none;
            font-size: large;
        }
        .items{
            display: none;
        }

        .menu:hover .items{
            display: block;
        }
        a:hover{
            color: red;

        }

    </style>
</head>
<body>
    <div class="menu">
        <h1>Menu</h1>
        <div class="items">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Contact</a></li>
                <li><a href="">Service</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
