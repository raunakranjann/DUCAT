<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Student Form</title>
    
    <style>
    form{
    border:4px solid dodgerblue;
    padding:12px;
    width:60%;
    }
    
   form>button{
   cursor:pointer;
   }
   form>input{
   width:300px;
  
   }
    </style>
  </head>
  <body>
    <form action="/student" method="post">
      Student Name : 
      <br>
      <input type="text" name="studentname" placeholder="Enter the Student Name..." required/> <br />
      <br>
      Course : 
      <br>
      <input type="text" name="coursename" placeholder="Enter the Course" required/> <br />
      <br>

      Total Marks :
      <br>
      <input type="number" name="studentmarks" min="0" max="100" placeholder="Enter the marks..." required />

      <br>
      <br>

      <button type="submit">Submit</button>
    </form>

    <p th:text="${message}"></p>
  </body>
</html>
