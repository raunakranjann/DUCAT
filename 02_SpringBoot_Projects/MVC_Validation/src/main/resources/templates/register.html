<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>User Registration</title>

    <style>
        .center{
            display: grid;
        }
        .center input{
            max-width: 60%;
        }
        .center button{
            max-width: 60%;
        }
    </style>
  </head>
  <body>
    <h2>Registration Form</h2>
    <form class="center" th:action="@{/register}" th:object="${user}" method="post">
      <!-- Name Field -->
      <label>Name:</label>
      <input type="text" th:field="*{name}" />
      <span th:errors="*{name}" style="color: red;"></span>
      <br /><br />

      <!-- Email Field -->
      <label>Email:</label>
      <input type="email" th:field="*{email}" />
      <span th:errors="*{email}" style="color: red;"></span>
      <br /><br />

      <!-- Password Field -->
      <label>Password:</label>
      <input type="password" th:field="*{password}" />
      <span th:errors="*{password}" style="color: red;"></span>
      <br /><br />

      <!-- Age Field -->
      <label>Age:</label>
      <input type="number" th:field="*{age}" />
      <span th:errors="*{age}" style="color: red;"></span>
      <br /><br />

      <!-- Submit Button -->
      <button type="submit">Register</button>
    </form>
  </body>
</html>
